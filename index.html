<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HR COMP 모바일</title>

    <link rel="stylesheet" href="css/common.css?v=20261010-02">
    <link rel="stylesheet" href="css/stock.css?v=20261010-02">
    <link rel="stylesheet" href="css/delivery.css?v=20261010-02">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

<div class="container">


    <!-- =====================================================
         LOGIN
         ===================================================== -->

    <section id="loginSection" class="hidden">

        <header class="login-header">

            <div class="company">
                HR COMP
            </div>

            <h1>
                모바일 업무조회
            </h1>

        </header>


        <div class="login-card">

            <label for="txtEmail">
                이메일
            </label>

            <input
                type="email"
                id="txtEmail"
                autocomplete="username"
            >


            <label for="txtPassword">
                비밀번호
            </label>

            <input
                type="password"
                id="txtPassword"
                autocomplete="current-password"
            >


            <button id="btnLogin"
                    class="login-button">

                로그인

            </button>


            <div id="loginMessage"
                 class="login-message">
            </div>

        </div>

    </section>




    <section id="menuSection" class="hidden">
        <header class="stock-header">
            <div><div class="company">HR COMP</div><h1>모바일 업무</h1></div>
            <button class="logout-button btnLogout">로그아웃</button>
        </header>
        <div class="menu-grid">
            <button id="btnMenuStock" class="menu-button">현재재고 조회</button>
            <button id="btnMenuCount" class="menu-button">재고실사</button>
            <button id="btnMenuDelivery" class="menu-button">고객주문 납기관리</button>
        </div>
    </section>

    <!-- =====================================================
         STOCK
         ===================================================== -->

    <section id="stockSection" class="hidden">


        <header class="stock-header">

            <div>

                <div class="company">
                    HR COMP
                </div>

                <h1>
                    현재재고 조회
                </h1>

            </div>


            <div class="header-actions">
                <button id="btnBackStock" class="back-button">업무메뉴</button>
                <button id="btnLogout" class="logout-button">로그아웃</button>
            </div>

        </header>



        <div class="filter-card">

            <label for="cboStockPartName">품목분류</label>
            <select id="cboStockPartName">
                <option value="">전체</option>
            </select>

        </div>


        <div class="search-area">

            <input
                type="text"
                id="txtSearch"
                placeholder="품번 / 품명 검색"
                autocomplete="off"
            >

            <button id="btnSearch">
                검색
            </button>

        </div>



        <div id="resultCount"
             class="result-count">

            품번 또는 품명을 입력하세요.

        </div>



        <div id="stockList">
        </div>


    </section>



    <section id="countSection" class="hidden">
        <header class="stock-header">
            <div><div class="company">HR COMP</div><h1>재고실사</h1></div>
            <div class="header-actions">
                <button id="btnBackCount" class="back-button">업무메뉴</button>
                <button class="logout-button btnLogout">로그아웃</button>
            </div>
        </header>

        <div class="filter-card">
            <label>실사번호</label>
            <select id="cboStockCount"></select>
            <div id="countProgress" class="progress-box">진행현황: -</div>

            <div class="filter-row">
                <div><label>Part Type</label><select id="cboPartType"><option value="">전체</option></select></div>
                <div><label>입력상태</label>
                    <select id="cboInputStatus">
                        <option value="NOT_ENTERED" selected>미입력</option>
                        <option value="ENTERED">입력</option>
                        <option value="ALL">전체</option>
                    </select>
                </div>
            </div>

            <label class="top-label">품번 검색</label>
            <div class="search-area">
                <input id="txtCountPartNo" type="text" placeholder="예: WHP, HBH" autocomplete="off">
                <button id="btnCountSearch">검색</button>
            </div>
        </div>
        <div id="countResultCount" class="result-count">실사번호를 선택하세요.</div>
        <div id="countList"></div>
    </section>

    <!-- CUSTOMER ORDER DELIVERY (READ ONLY) -->
    <section id="deliverySection" class="hidden">
        <header class="stock-header">
            <div><div class="company">HR COMP</div><h1>고객주문 납기관리</h1></div>
            <div class="header-actions">
                <button id="btnBackDelivery" class="back-button">업무메뉴</button>
                <button class="logout-button btnLogout">로그아웃</button>
            </div>
        </header>

        <div id="deliveryOrdersPanel">
            <div class="filter-card">
                <label for="txtDeliverySearch">고객사 / 주문번호 검색</label>
                <div class="search-area">
                    <input id="txtDeliverySearch" type="search" placeholder="전체 조회 또는 검색어 입력" autocomplete="off">
                    <button id="btnDeliverySearch">검색</button>
                </div>
            </div>
            <div id="deliveryOrderCount" class="result-count">조회 중...</div>
            <div id="deliveryOrderList"></div>
        </div>

        <div id="deliveryItemsPanel" class="hidden">
            <button id="btnDeliveryToOrders" class="delivery-nav">← 고객주문 목록</button>
            <div id="deliverySelectedOrder" class="delivery-context"></div>
            <div id="deliveryItemCount" class="result-count"></div>
            <div id="deliveryItemList"></div>
        </div>

        <div id="deliveryTracePanel" class="hidden">
            <button id="btnDeliveryToItems" class="delivery-nav">← 품목별 납기현황</button>
            <div id="deliveryTraceContext" class="delivery-context"></div>
            <div id="deliveryTraceList"></div>
        </div>
    </section>

</div>

<script src="js/config.js?v=20261010-02"></script>
<script src="js/app.js?v=20261010-02"></script>
<script src="js/stock.js?v=20261010-02"></script>
<script src="js/delivery.js?v=20261010-02"></script>
<script src="js/auth.js?v=20261010-02"></script>

</body>

</html>
